# SYSTEM-OWNED - do not edit. This form's field ids are a contract with .github/workflows/team-formation.yml,
# which parses them; both are re-pushed by every bootstrap and nightly refresh.
name: Join team
description: Join or form a team for a group assignment
title: "Join team"
labels: ["team-formation"]
body:
  - type: markdown
    attributes:
      value: |
        The teams that already exist, and how much room each has left, are listed on [the assignment's page](https://hertie-maths-data-science-f2026.github.io/assignments/02-assignment-2.html).

        To **join** one, choose *Join an existing team* and type its name exactly as that page spells it. To **start** one, choose *Create a new team* and pick a name nobody is using yet.

        Already in a team? Joining or creating another moves you out of your current one while team formation is open.
  # dsl:assignment-field:start - AUTO-GENERATED from this cohort's
  # `classroom-config/assignments.lock.yml`: the assignments open for team
  # formation right now. Edits between these markers are overwritten.
  - type: dropdown
    id: assignment
    attributes:
      label: Assignment
      description: The group assignment you are forming a team for.
      options:
        - assignment-2
    validations:
      required: true
  # dsl:assignment-field:end
  - type: dropdown
    id: action
    attributes:
      label: Action
      description: Joining a team and starting one are different things - say which, so a typo in the name below cannot silently open a second team.
      options:
        - Join an existing team
        - Create a new team
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: Team
      description: "Team name (letters, numbers, dashes)."
      placeholder: "e.g. team-x"
    validations:
      required: true
